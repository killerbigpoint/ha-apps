name: Immich
version: 0.1.3
slug: immich
description: Self-hosted photo and video management with PostgreSQL and Redis, using remote machine learning
url: https://immich.app
image: ghcr.io/killerbigpoint/{arch}-addon-immich
arch:
  - aarch64
  - amd64

init: false
startup: services
boot: auto
stage: experimental
restore_backup: false

webui: "[PROTO:ssl]://[HOST]:[PORT:8080]"

map:
  - type: app_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl

backup: cold
backup_exclude:
  - "**/cache"
  - "**/logs"

ports:
  "8080/tcp": 2283

ports_description:
  "8080/tcp": "Immich Web Interface"

options:
  TZ: Europe/Copenhagen
  IMMICH_LOG_LEVEL: log
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  DB_STORAGE_TYPE: HDD
  IMMICH_TRUSTED_PROXIES: 172.30.32.0/23
  IMMICH_PROCESS_INVALID_IMAGES: false
  IMMICH_MEDIA_LOCATION: /media/immich
  PUID: 0
  PGID: 0
  APPLY_PERMISSIONS: false

schema:
  TZ: str?
  IMMICH_LOG_LEVEL: list(verbose|debug|log|warn|error)
  ssl: bool
  certfile: str?
  keyfile: str?
  DB_STORAGE_TYPE: list(SSD|HDD)
  IMMICH_TRUSTED_PROXIES: str?
  IMMICH_PROCESS_INVALID_IMAGES: bool?
  IMMICH_MEDIA_LOCATION: match(^/config/library$|^/(media|share)(/.*)?$)
  PUID: int(0,)
  PGID: int(0,)
  APPLY_PERMISSIONS: bool
  backup_location: str?
  restore_backup: bool
  delete_db: bool?
  clean_redis: bool?
