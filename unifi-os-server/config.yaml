name: "UniFi OS Server"
version: 0.2.3
slug: unifi_os_server
description: Self-hosted UniFi OS Server running its native systemd service stack
url: https://github.com/killerbigpoint/ha-apps/tree/main/unifi-os-server
image: ghcr.io/killerbigpoint/{arch}-addon-unifi-os-server
arch:
  - amd64
  - aarch64
init: false
stage: experimental
boot: manual
startup: services
full_access: true
host_network: false
apparmor: false
tmpfs: false

privileged:
  - SYS_ADMIN

ports:
  "443/tcp": 11443
  "8080/tcp": 8080
  "3478/udp": 3478
  "10003/udp": 10003
  "5005/tcp": null
  "6789/tcp": null
  "8444/tcp": null
  "8880/tcp": null
  "8881/tcp": null
  "8882/tcp": null
  "9543/tcp": null
  "28082/tcp": null
  "5671/tcp": null
  "5514/udp": null

ports_description:
  "443/tcp": "UniFi OS Web Interface"
  "8080/tcp": "Device Communication / Inform"
  "3478/udp": "STUN"
  "10003/udp": "Device Discovery During Adoption"
  "5005/tcp": "RTP Control"
  "6789/tcp": "Mobile Speed Test"
  "8444/tcp": "Hotspot HTTPS Portal"
  "8880/tcp": "Hotspot HTTP Redirect"
  "8881/tcp": "Hotspot HTTP Redirect"
  "8882/tcp": "Hotspot HTTP Redirect"
  "9543/tcp": "UniFi Identity Hub"
  "28082/tcp": "Device Support File Downloads"
  "5671/tcp": "AMQPS"
  "5514/udp": "Remote Syslog"

webui: "https://[HOST]:[PORT:443]"

options:
  UOS_SYSTEM_IP: ""
  HARDWARE_PLATFORM: ""

schema:
  UOS_SYSTEM_IP: str?
  HARDWARE_PLATFORM: "match(^$|^synology$)"

environment:
  container: docker
