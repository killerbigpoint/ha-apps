name: Build & Publish UniFi OS Server

on:
  push:
    branches: [main]
    paths:
      - "unifi-os-server/**"
      - ".github/workflows/build-unifi-os-server.yml"
  workflow_dispatch: {}
  schedule:
    # Check after the base-image repository's daily Network release check.
    - cron: "15 8 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check base-image digest and version add-on when it changes
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          BASE_IMAGE=$(ruby -ryaml -e 'puts YAML.load_file("unifi-os-server/build.yaml").fetch("build_from").fetch("amd64")')
          BASE_MANIFEST=$(docker buildx imagetools inspect --raw "$BASE_IMAGE")
          BASE_DIGEST="sha256:$(printf '%s' "$BASE_MANIFEST" | sha256sum | awk '{print $1}')"
          CURRENT_VERSION=$(ruby -ryaml -e 'puts YAML.load_file("unifi-os-server/config.yaml").fetch("version").to_s')
          TRACKED_DIGEST=$(cat unifi-os-server/base-image-digest.txt 2>/dev/null || true)
          SHOULD_BUILD=true

          if [ "$BASE_DIGEST" = "$TRACKED_DIGEST" ] && [ "$EVENT_NAME" = "schedule" ]; then
            echo "Base image has not changed; skipping the scheduled add-on build."
            SHOULD_BUILD=false
          elif [ "$BASE_DIGEST" != "$TRACKED_DIGEST" ]; then
            if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Add-on version '$CURRENT_VERSION' is not a simple MAJOR.MINOR.PATCH version" >&2
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            RELEASE_DATE=$(date -u +%Y-%m-%d)

            sed -i "s/^version: .*/version: ${NEW_VERSION}/" unifi-os-server/config.yaml
            printf '%s\n' "$BASE_DIGEST" > unifi-os-server/base-image-digest.txt

            TEMP_CHANGELOG=$(mktemp)
            awk -v version="$NEW_VERSION" -v date="$RELEASE_DATE" '
              { print }
              !inserted && $0 == "---" {
                print ""
                print "## [" version "] - " date
                print ""
                print "### Changed"
                print ""
                print "- Rebuilt against an updated UniFi OS Server base image."
                print ""
                print "---"
                inserted=1
              }
            ' unifi-os-server/CHANGELOG.md > "$TEMP_CHANGELOG"
            mv "$TEMP_CHANGELOG" unifi-os-server/CHANGELOG.md

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add unifi-os-server/config.yaml unifi-os-server/CHANGELOG.md unifi-os-server/base-image-digest.txt
            git commit -m "chore(unifi-os-server): bump add-on to ${NEW_VERSION} for updated base image"
            git push origin "HEAD:${BRANCH_NAME}"
            CURRENT_VERSION="$NEW_VERSION"
            echo "Updated add-on version to ${NEW_VERSION} for base image ${BASE_DIGEST}"
          fi

          {
            echo "should_build=$SHOULD_BUILD"
            echo "version=$CURRENT_VERSION"
            echo "base_image=$BASE_IMAGE"
            echo "base_digest=$BASE_DIGEST"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
          - ha_arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Read add-on metadata
        id: metadata
        env:
          HA_ARCH: ${{ matrix.ha_arch }}
        run: |
          ruby -ryaml -e '
            arch = ENV.fetch("HA_ARCH")
            config = YAML.load_file("unifi-os-server/config.yaml")
            build = YAML.load_file("unifi-os-server/build.yaml")

            version = config.fetch("version").to_s
            image = config.fetch("image").gsub("{arch}", arch)
            build_from = build.fetch("build_from").fetch(arch)

            abort "Add-on version is missing" if version.empty?
            abort "Image name is missing for #{arch}" if image.empty?
            abort "BUILD_FROM is missing for #{arch}" if build_from.to_s.empty?

            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "version=#{version}"
              output.puts "image=#{image}"
              output.puts "build_from=#{build_from}"
            end
          '

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.ha_arch }}
        uses: docker/build-push-action@v6
        with:
          context: unifi-os-server
          file: unifi-os-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.metadata.outputs.build_from }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Read add-on version
        id: version
        run: |
          version="$(ruby -ryaml -e 'puts YAML.load_file("unifi-os-server/config.yaml").fetch("version")')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release tag exists
        id: check_tag
        run: |
          tag="unifi-os-server-v${{ steps.version.outputs.version }}"
          git fetch --tags
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists — skipping release creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' unifi-os-server/CHANGELOG.md | sed -e '1{/^$/d;}' -e '${/^$/d;}' > /tmp/changelog.txt

          if [ ! -s /tmp/changelog.txt ]; then
            echo "No changelog section found for version $version" >&2
            exit 1
          fi

          echo "" >> /tmp/changelog.txt
          echo "[UniFi OS Server upstream project](https://github.com/clllaur/unifi-os-server)" >> /tmp/changelog.txt

          {
            echo 'body<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unifi-os-server-v${{ steps.version.outputs.version }}
          name: UniFi OS Server v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
