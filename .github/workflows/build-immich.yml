name: Build & Publish Immich

on:
  push:
    branches: [main]
    paths:
      - "immich/**"
      - ".github/workflows/build-immich.yml"
  workflow_dispatch: {}
  schedule:
    # Check daily for an updated upstream all-in-one NoML image.
    - cron: "15 8 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      version: ${{ steps.prepare.outputs.version }}
      base_image: ${{ steps.prepare.outputs.base_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DH_USER" || -z "$DH_TOKEN" ]]; then
            echo "::error::Docker Hub username or token secret is missing"
            exit 1
          fi

          printf '%s' "$DH_TOKEN" | docker login docker.io \
            --username "$DH_USER" --password-stdin
      
      - name: Check upstream image digest and bump app version when it changes
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          
          BASE_IMAGE="docker.io/fabioogaravini/hassio-immich-noml:latest"
          
          if ! INSPECT_OUTPUT="$(docker buildx imagetools inspect "$BASE_IMAGE" 2>&1)"; then
            echo "::error::Failed to inspect upstream image: $BASE_IMAGE"
            printf '%s\n' "$INSPECT_OUTPUT"
            exit 1
          fi
          
          BASE_DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$INSPECT_OUTPUT")"
          
          if [ -z "$BASE_DIGEST" ]; then
            echo "::error::Could not extract upstream image digest"
            printf '%s\n' "$INSPECT_OUTPUT"
            exit 1
          fi
          
          CURRENT_VERSION="$(ruby -ryaml -e 'puts YAML.load_file("immich/config.yaml").fetch("version").to_s')"
          TRACKED_DIGEST="$(cat immich/base-image-digest.txt 2>/dev/null || true)"
          SHOULD_BUILD=true
          
          if [ -z "$BASE_DIGEST" ]; then
            echo "Could not determine digest for $BASE_IMAGE" >&2
            exit 1
          fi
          
          if [ "$BASE_DIGEST" = "$TRACKED_DIGEST" ] && [ "$EVENT_NAME" = "schedule" ]; then
            echo "Upstream image has not changed; skipping scheduled build."
            SHOULD_BUILD=false
          elif [ "$BASE_DIGEST" != "$TRACKED_DIGEST" ]; then
            if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "App version '$CURRENT_VERSION' is not MAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            RELEASE_DATE="$(date -u +%Y-%m-%d)"

            sed -i "s/^version: .*/version: ${NEW_VERSION}/" immich/config.yaml
            printf '%s\n' "$BASE_DIGEST" > immich/base-image-digest.txt

            TEMP_CHANGELOG="$(mktemp)"
            {
              head -n 1 immich/CHANGELOG.md
              echo
              echo "## [${NEW_VERSION}] - ${RELEASE_DATE}"
              echo
              echo "### Changed"
              echo
              echo "- Rebuilt against updated upstream NoML image (${BASE_DIGEST})."
              echo
              tail -n +2 immich/CHANGELOG.md
            } > "$TEMP_CHANGELOG"
            mv "$TEMP_CHANGELOG" immich/CHANGELOG.md

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add immich/config.yaml immich/CHANGELOG.md immich/base-image-digest.txt
            git commit -m "chore(immich): bump app to ${NEW_VERSION} for updated base image"
            git push origin "HEAD:${BRANCH_NAME}"

            CURRENT_VERSION="$NEW_VERSION"
            echo "Updated Immich app version to ${NEW_VERSION}."
          fi

          {
            echo "should_build=$SHOULD_BUILD"
            echo "version=$CURRENT_VERSION"
            echo "base_image=$BASE_IMAGE"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
          - ha_arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout latest main (includes automatic version bump)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DH_USER" || -z "$DH_TOKEN" ]]; then
            echo "::error::Docker Hub username or token secret is missing"
            exit 1
          fi

          printf '%s' "$DH_TOKEN" | docker login docker.io \
            --username "$DH_USER" --password-stdin

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.ha_arch }}
        uses: docker/build-push-action@v6
        with:
          context: immich
          file: immich/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ needs.prepare.outputs.base_image }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
          tags: |
            ghcr.io/killerbigpoint/${{ matrix.ha_arch }}-addon-immich:${{ needs.prepare.outputs.version }}
            ghcr.io/killerbigpoint/${{ matrix.ha_arch }}-addon-immich:latest

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check if release tag exists
        id: check_tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="immich-v${VERSION}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' immich/CHANGELOG.md > /tmp/changelog.txt

          if [ ! -s /tmp/changelog.txt ]; then
            echo "No changelog section found for ${VERSION}" >&2
            exit 1
          fi

          echo "" >> /tmp/changelog.txt
          echo "[Immich upstream](https://github.com/immich-app/immich) · [Home Assistant app source](https://github.com/killerbigpoint/ha-apps/tree/main/immich)" >> /tmp/changelog.txt

          {
            echo 'body<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immich-v${{ needs.prepare.outputs.version }}
          name: Immich v${{ needs.prepare.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
